- Class: meta
  Course: Muestreo Unidad II
  Lesson: 01 Introduccion al Muestreo
  Author: Equipo de Estadistica UACJ
  Type: Standard
  Organization: Universidad Autonoma de Ciudad Juarez
  Version: 2.4.5

- Class: text
  Output: "Leccion 1. Introduccion al Muestreo. Objetivo de aprendizaje: al terminar esta leccion podras distinguir poblacion, muestra y marco muestral, explicar por que se muestrea en lugar de estudiar a toda la poblacion, y reconocer los conceptos que se usaran en el resto del curso."

- Class: text
  Output: "En estadistica, la POBLACION es el conjunto completo de elementos que nos interesa estudiar (por ejemplo, todos los usuarios de una app). Una MUESTRA es un subconjunto de esa poblacion, seleccionado para obtener conclusiones sin tener que revisar cada elemento."

- Class: text
  Output: "Ya se cargo en tu sesion el objeto 'poblacion', con las calificaciones de 10 estudiantes de un grupo. Tambien tienes 'N', el tamano de esa poblacion, y 'id_estudiante', los identificadores de cada uno. Estos objetos los creo initLesson.R antes de que comenzaras la leccion."

- Class: cmd_question
  Output: "Escribe 'poblacion' para ver las 10 calificaciones que representan a toda la poblacion de este ejemplo."
  CorrectAnswer: poblacion
  AnswerTests: omnitest(correctExpr='poblacion')
  Hint: "Simplemente escribe el nombre del objeto: poblacion"

- Class: cmd_question
  Output: "¿Cuantos elementos tiene la poblacion? Usa la funcion length() sobre 'poblacion' para comprobarlo (en lugar de contarlos a mano)."
  CorrectAnswer: length(poblacion)
  AnswerTests: omnitest(correctExpr='length(poblacion)')
  Hint: "length(poblacion)"

- Class: text
  Output: "Casi nunca es posible o conveniente estudiar a toda una poblacion: puede ser muy grande, costosa de medir, cambiante en el tiempo, o algunos elementos pueden ser dificiles de alcanzar. Por eso trabajamos con muestras y usamos la estadistica para inferir el comportamiento de la poblacion a partir de ellas."

- Class: mult_question
  Output: "¿Cual de las siguientes es la razon PRINCIPAL por la que en la practica se estudia una muestra y no toda la poblacion?"
  AnswerChoices: Porque la muestra siempre da resultados mas exactos que la poblacion;Porque estudiar a toda la poblacion suele ser costoso, lento o imposible en la practica;Porque la ley obliga a usar muestras en todo estudio estadistico;Porque las muestras eliminan por completo el error estadistico
  CorrectAnswer: Porque estudiar a toda la poblacion suele ser costoso, lento o imposible en la practica
  AnswerTests: omnitest(correctVal='Porque estudiar a toda la poblacion suele ser costoso, lento o imposible en la practica')
  Hint: "Piensa en el costo, el tiempo y la dificultad de medir a CADA elemento de una poblacion grande."

- Class: text
  Output: "El MARCO MUESTRAL es la lista real y accesible de los elementos de la poblacion, a partir de la cual se seleccionara la muestra. En nuestro ejemplo, 'id_estudiante' funciona como marco muestral: es la lista de identificadores desde la cual elegiriamos a quienes muestrear."

- Class: cmd_question
  Output: "Muestra el marco muestral de este ejemplo escribiendo 'id_estudiante'."
  CorrectAnswer: id_estudiante
  AnswerTests: omnitest(correctExpr='id_estudiante')
  Hint: "id_estudiante"

- Class: mult_question
  Output: "Una empresa quiere conocer la satisfaccion de TODOS sus 50,000 usuarios, pero solo tiene una lista de correos de 42,000 de ellos (los demas nunca dejaron su correo). Si la empresa envia la encuesta solo a esos 42,000 correos, esa lista de 42,000 usuarios es:"
  AnswerChoices: La poblacion completa del estudio;El marco muestral, que no coincide exactamente con la poblacion;Una muestra aleatoria simple ya obtenida;Un estadistico de la poblacion
  CorrectAnswer: El marco muestral, que no coincide exactamente con la poblacion
  AnswerTests: omnitest(correctVal='El marco muestral, que no coincide exactamente con la poblacion')
  Hint: "El marco muestral es la lista accesible desde la que se muestrea; no siempre incluye a TODA la poblacion real."

- Class: text
  Output: "Interpretacion: si un marco muestral deja fuera sistematicamente a cierto tipo de personas (por ejemplo, quienes no usan correo electronico), cualquier muestra tomada de ese marco puede no representar bien a la poblacion completa. Esto es un error de cobertura, y es una de las primeras cosas que se revisan antes de muestrear."

- Class: exact_question
  Output: "En una palabra: cuando el marco muestral excluye sistematicamente a un grupo de la poblacion, decimos que existe un error de ____ (empieza con 'c')."
  CorrectAnswer: cobertura
  AnswerTests: omnitest(correctVal='cobertura', ignore_case=TRUE)
  Hint: "Tiene que ver con que el marco no 'cubre' a toda la poblacion."

- Class: text
  Output: "Actividad de aplicacion: imagina que trabajas en el equipo de calidad de una app movil y necesitas estimar el tiempo promedio de carga que perciben los usuarios. A continuacion definiras, en tus propias palabras, cual seria la poblacion y cual podria ser un marco muestral razonable para ese estudio."

- Class: text
  Output: "Piensa por un momento: la poblacion serian TODOS los usuarios que abren la app en un periodo dado, mientras que un marco muestral razonable podria ser el registro de eventos ('logs') del servidor, que contiene los tiempos de carga de las sesiones efectivamente registradas."

- Class: mult_question
  Output: "Si el servidor solo registra logs de usuarios con conexion estable (y pierde los eventos de quienes tienen mala señal), ¿que problema introduce esto al usar ese log como marco muestral?"
  AnswerChoices: Ningun problema, el log sigue representando a toda la poblacion;Subestimara el tiempo de carga real, porque excluye a usuarios con peor conexion (que probablemente tienen tiempos mas altos);Hara que la muestra sea mas grande de lo necesario;Convertira automaticamente el estudio en un censo
  CorrectAnswer: Subestimara el tiempo de carga real, porque excluye a usuarios con peor conexion (que probablemente tienen tiempos mas altos)
  AnswerTests: omnitest(correctVal='Subestimara el tiempo de carga real, porque excluye a usuarios con peor conexion (que probablemente tienen tiempos mas altos)')
  Hint: "¿Que tipo de usuarios faltarian en el log, y hacia donde sesgaria eso el promedio de tiempos de carga?"

- Class: text
  Output: "Resumen de la leccion 1: aprendiste que la poblacion es el conjunto completo de interes, la muestra es un subconjunto de ella, y el marco muestral es la lista real desde la que se selecciona esa muestra. Tambien viste que un marco muestral incompleto puede sesgar los resultados. En la siguiente leccion aplicaras estos conceptos usando R para seleccionar muestras con distintos metodos: aleatorio simple, sistematico, estratificado, por conglomerados y por conveniencia."
